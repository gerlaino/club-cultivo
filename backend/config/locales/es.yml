      default: "%d/%m/%Y"
      short: "%d %b"
      long: "%d de %B de %Y"
  time:
    formats:
      default: "%d/%m/%Y %H:%M"
      short: "%d %b %H:%M"
      long: "%d de %B de %Y a las %H:%M"
  activerecord:
    errors:
      messages:
        record_invalid: "La validación falló: %{errors}"
        required: "es obligatorio"
        blank: "no puede estar vacío"
        taken: "ya está en uso"
        invalid: "no es válido"
        too_short:
          one: "es demasiado corto (mínimo 1 caracter)"
          other: "es demasiado corto (mínimo %{count} caracteres)"
        too_long:
          one: "es demasiado largo (máximo 1 caracter)"
          other: "es demasiado largo (máximo %{count} caracteres)"
        # Faltaban las de números y el usuario veía el error CRUDO de i18n en pantalla:
        # "Cantidad Translation missing. Options considered were: - es.activerecord.errors…".
        not_a_number: "tiene que ser un número"
        not_an_integer: "tiene que ser un número entero"
        greater_than: "tiene que ser mayor que %{count}"
        greater_than_or_equal_to: "tiene que ser mayor o igual que %{count}"
        less_than: "tiene que ser menor que %{count}"
        less_than_or_equal_to: "tiene que ser menor o igual que %{count}"
        equal_to: "tiene que ser igual a %{count}"
        other_than: "tiene que ser distinto de %{count}"
        odd: "tiene que ser impar"
        even: "tiene que ser par"
        inclusion: "no está en la lista"
        exclusion: "no está disponible"
        confirmation: "no coincide"
        present: "tiene que estar vacío"
        accepted: "hay que aceptarlo"
      models:
        dispensacion:
          attributes:
            sede:
              required: "debe existir"
        stock:
          attributes:
            sede:
              required: "debe existir"
        movimiento_contable:
          attributes:
            sede:
              required: "debe existir"
