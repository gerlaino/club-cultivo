# ─────────────────────────────────────────────────────────────────────────────
# Cultivo Espacial — infraestructura declarada (Render Blueprint)
#
# ESTE ARCHIVO DECLARA SÓLO PREPRODUCCIÓN, A PROPÓSITO.
#
# La app en vivo hoy corre en servicios creados a mano en el panel de Render, con más de
# veinticinco variables de entorno tipeadas una por una y sin copia en ningún lado. Aplicar un
# blueprint sobre eso puede sobrescribir la configuración de un servicio que está andando — que es
# exactamente cómo se rompió la última vez, y por lo que hubo que volver todo atrás.
#
# Así que el orden es: se levanta preproducción desde acá (servicios NUEVOS, nombres que no chocan
# con nada, imposible que toquen lo que anda), se verifica, y recién después se decide si producción
# se adopta en este mismo archivo. Producción está documentada entera en `docs/DEPLOY.md`.
#
# ─────────────────────────────────────────────────────────────────────────────
# POR QUÉ ESTE ARCHIVO EXISTE
#
# Sin él, "el ambiente" es un servicio web + un worker + una base + un Redis + 25 variables que
# viven únicamente adentro del panel. No se pueden comparar dos ambientes, no se puede revisar un
# cambio antes de aplicarlo, y cuando algo se rompe no hay a qué volver. Acá está en git: se revisa
# como código y se revierte como código.
#
# ─────────────────────────────────────────────────────────────────────────────
# LA REGLA QUE NO SE NEGOCIA: PREPRODUCCIÓN Y PRODUCCIÓN NO COMPARTEN NADA
#
# Ni base, ni Redis, ni bucket, ni casilla de correo, ni un solo secreto. Los secretos de acá se
# generan solos (`generateValue: true`), así que ni siquiera existe la tentación de copiar los de
# producción. Es la lección que dejó la cookie de sesión que apareció commiteada: si los secretos
# hubieran sido compartidos, una filtración de un ambiente de prueba era una filtración de la app
# en vivo.
#
# CONSECUENCIA IMPORTANTE, y es deliberada: las claves de cifrado at-rest son distintas, así que
# **preproducción no puede leer un backup de producción**. Está bien que sea así — los datos de
# salud de pacientes reales no van a un ambiente de pruebas (Ley 25.326). Si hace falta volumen
# realista, se siembra con `rake club:demo`.
# ─────────────────────────────────────────────────────────────────────────────

databases:
  - name: cultivo-pre-db
    databaseName: cultivo_pre
    user: cultivo_pre
    postgresMajorVersion: "16"
    plan: basic-256mb

services:
  # ── Redis: cola de Sidekiq y adaptador de ActionCable ──────────────────────
  # No es opcional. Sin esto no corren los jobs (vencimientos de REPROCANN, alertas, envíos de
  # correo, informes) ni el tiempo real de stock y ambiente.
  - type: redis
    name: cultivo-pre-redis
    plan: free
    ipAllowList: []          # sólo desde adentro de Render
    maxmemoryPolicy: noeviction   # Sidekiq NO tolera que le borren claves: perdería jobs

  # ── La app: API + SPA en el MISMO ORIGEN ───────────────────────────────────
  # `bin/render-build.sh` compila el frontend y lo deja en `backend/public/`, así que este único
  # servicio sirve las dos cosas. No hay un static site aparte, y no debe haberlo: el login en
  # incógnito y en iOS depende de que la cookie sea first-party.
  - type: web
    name: cultivo-pre-api
    runtime: ruby
    plan: starter
    region: oregon           # el mismo que producción: la latencia a la base importa
    rootDir: backend
    branch: master
    autoDeploy: true         # preproducción SÍ despliega sola con cada push a master
    buildCommand: bash bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up     # OJO: "/" contesta 404 a propósito, no sirve como health check
    envVars:
      - key: RAILS_ENV
        value: production    # Rails corre en modo production TAMBIÉN acá: probar en un modo
                             # distinto al de la app real no prueba la app real
      - key: RAILS_LOG_LEVEL
        value: info
      - key: RAILS_MAX_THREADS
        value: "3"

      # ── Conexiones ──
      - key: DATABASE_URL
        fromDatabase:
          name: cultivo-pre-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cultivo-pre-redis
          property: connectionString

      # ── Secretos: los genera Render, distintos de producción y de nadie ──
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DEVISE_JWT_SECRET_KEY
        generateValue: true      # sin esta, la app NO ARRANCA (lanza excepción a propósito)

      # ── Cifrado at-rest de datos de salud (Ley 25.326 art. 9) ──
      # Sin las TRES la app no arranca: `config/application.rb` lo verifica al bootear y no hay
      # fallback silencioso. Distintas de las de producción, ver la nota de arriba.
      - key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        generateValue: true
      - key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        generateValue: true
      - key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        generateValue: true

      # ── Dominio propio de este ambiente ──
      # Con la app y la API en el mismo origen, esto es la URL del servicio. Alimenta CORS y los
      # orígenes permitidos de ActionCable: mal puesto, el tiempo real se cae EN SILENCIO.
      - key: FRONTEND_URL
        value: https://cultivo-pre-api.onrender.com
      - key: APP_HOST
        value: cultivo-pre-api.onrender.com

      # ── Archivos (fotos de plantas, PDFs, documentos clínicos) ──
      # Bucket PROPIO de preproducción. Compartir el de producción significa que una prueba puede
      # borrar un documento clínico real.
      - key: ACTIVE_STORAGE_SERVICE
        value: amazon
      - key: S3_ENDPOINT
        sync: false          # R2: https://<account_id>.r2.cloudflarestorage.com
      - key: S3_REGION
        value: auto          # "auto" es lo que corresponde en Cloudflare R2
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      # ── Panel de Sidekiq (/sidekiq) ──
      # En production el panel pide usuario/contraseña. Sin esta variable queda 'changeme'.
      - key: SIDEKIQ_PASSWORD
        generateValue: true

      # ── Opcionales: si faltan, se apaga esa función y el resto anda ──
      - key: ANTHROPIC_API_KEY
        sync: false          # sin esto no hay asistente, análisis de lote ni lectura de CSV
      - key: SMTP_HOST
        sync: false          # sin SMTP no sale NINGÚN correo de plataforma
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: noreply@cultivoespacial.com
      - key: VAPID_PUBLIC_KEY
        sync: false          # sin las VAPID no hay notificaciones push
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        sync: false
      - key: ARICCAME_SIMULAR
        value: "true"        # en preproducción NUNCA se transmite a un organismo de verdad

  # ── El worker: todo lo que no pasa por una pantalla ────────────────────────
  # Vencimientos de REPROCANN, alertas de ambiente, envíos masivos, informes, push.
  # Estuvo 79 días sin existir en producción y nadie lo notó, porque su ausencia no rompe nada
  # visible: simplemente los avisos dejan de llegar. Va declarado desde el día uno.
  - type: worker
    name: cultivo-pre-worker
    runtime: ruby
    plan: starter
    region: oregon
    rootDir: backend
    branch: master
    autoDeploy: true
    buildCommand: bundle install
    startCommand: bundle exec sidekiq -C config/sidekiq.yml
    envVars:
      # El worker toca la MISMA base y el MISMO Redis que la web, y necesita las MISMAS claves de
      # cifrado: si no, un job que lee una indicación médica revienta.
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cultivo-pre-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cultivo-pre-redis
          property: connectionString
      - key: SECRET_KEY_BASE
        fromService:
          type: web
          name: cultivo-pre-api
          envVarKey: SECRET_KEY_BASE
      - key: DEVISE_JWT_SECRET_KEY
        fromService:
          type: web
          name: cultivo-pre-api
          envVarKey: DEVISE_JWT_SECRET_KEY
      - key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        fromService:
          type: web
          name: cultivo-pre-api
          envVarKey: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
      - key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        fromService:
          type: web
          name: cultivo-pre-api
          envVarKey: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
      - key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        fromService:
          type: web
          name: cultivo-pre-api
          envVarKey: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
      # Los mailers arman links absolutos: sin esto salen apuntando a localhost.
      - key: FRONTEND_URL
        value: https://cultivo-pre-api.onrender.com
      - key: APP_HOST
        value: cultivo-pre-api.onrender.com
      - key: ACTIVE_STORAGE_SERVICE
        value: amazon
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: noreply@cultivoespacial.com
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        sync: false
