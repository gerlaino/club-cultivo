# ─────────────────────────────────────────────────────────────────────────────
# Infra de Render, declarada. Antes vivía a mano en el dashboard y solo el cron
# de backup estaba acá: no había forma de recrear el entorno ni de saber qué
# estaba configurado dónde. Con clubes ajenos operando, eso deja de ser viable.
#
# Qué hay:
#   · club-cultivo        web    (Rails + la SPA compilada adentro)  ← PRODUCCIÓN
#   · club-cultivo-worker worker (Sidekiq: vencimientos, alertas, push)
#   · staging + staging-worker + su propia base                       ← PRE-PROD
#   · db-backup-diario    cron   (Postgres → R2)
#
# ⚠️ Los servicios de PRODUCCIÓN ya existen creados a mano. Aplicar este
# blueprint sobre ellos puede pisarles configuración. El camino seguro es:
#   1) Aplicar el blueprint para levantar SOLO staging (comentando prod), y
#   2) una vez que staging anda, alinear prod servicio por servicio.
#
# Las claves NO van acá: todas con `sync: false` se cargan a mano una vez.
# ─────────────────────────────────────────────────────────────────────────────

databases:
  - name: club-cultivo-staging-db
    databaseName: club_cultivo_staging
    plan: basic-256mb        # staging no necesita más; prod se administra aparte
    postgresMajorVersion: "16"

services:
  # ── STAGING ───────────────────────────────────────────────────────────────
  # Copia fiel de producción contra su propia base. Se puebla con
  # `rake club:demo`, NUNCA con datos reales de un club.
  - type: web
    name: club-cultivo-staging
    runtime: ruby
    plan: starter
    branch: staging          # merge a `staging` → deploy acá; a `master` → prod
    rootDir: backend
    buildCommand: bash bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: RAILS_ENV
        value: production    # staging corre en modo production: es lo que se quiere probar
      - key: RACK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: club-cultivo-staging-db
          property: connectionString
      # El Redis de prod, pero en la base /1 (prod usa la /0): claves separadas, cero costo.
      # Se carga a mano porque hay que agregarle el /1 al final.
      - key: REDIS_URL
        sync: false
      - key: RAILS_MAX_THREADS
        value: "3"
      # Secretos: se cargan a mano en el dashboard, una sola vez.
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        sync: false
      - key: DEVISE_JWT_SECRET_KEY
        sync: false
      - key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        sync: false
      - key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        sync: false
      - key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        sync: false
      # Storage: bucket PROPIO de staging. Compartir el de prod significa que una
      # prueba puede pisar o borrar archivos reales de un club.
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto
      - key: FRONTEND_URL
        sync: false
      - key: APP_HOST
        sync: false

  - type: worker
    name: club-cultivo-staging-worker
    runtime: ruby
    plan: starter
    branch: staging
    rootDir: backend
    buildCommand: bundle install
    startCommand: bundle exec sidekiq -C config/sidekiq.yml
    autoDeploy: true
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: club-cultivo-staging-db
          property: connectionString
      # MISMO valor que su web (base /1): los cron se registran acá y las colas se comparten.
      - key: REDIS_URL
        sync: false
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        sync: false
      # Estas CUATRO cortan el arranque si faltan (application.rb:55 y devise.rb:326).
      # No hay fallback a propósito: sin ellas la app "arrancaría" sin poder leer datos
      # clínicos. Si el worker crashea al bootear, es casi seguro que falta alguna.
      - key: DEVISE_JWT_SECRET_KEY
        sync: false
      - key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        sync: false
      - key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        sync: false
      - key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        sync: false

  # ── BACKUP DE PRODUCCIÓN ──────────────────────────────────────────────────
  # OJO: si ya existe un cron de backup creado a mano con OTRO nombre, este crea un SEGUNDO
  # que corre en paralelo. Con el mismo nombre, Render lo adopta en vez de duplicarlo.
  - type: cron
    name: db-backup-diario
    runtime: ruby
    plan: starter
    rootDir: backend
    # 07:00 UTC = 04:00 Argentina (UTC-3) → horario de baja carga. Una corrida por día.
    schedule: "0 7 * * *"
    buildCommand: bundle install
    startCommand: bundle exec rake backup:create
    autoDeploy: false
    envVars:
      # Connection string de la base de PRODUCCIÓN (Internal Database URL del dashboard).
      - key: DATABASE_URL
        sync: false
      # Bucket R2 dedicado a los backups (distinto del bucket de ActiveStorage).
      - key: BACKUP_BUCKET
        sync: false
      # Credenciales R2 del token de backup (least-privilege). Si preferís reusar las del
      # app storage, borrá estas dos y el task cae a S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY.
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      # Endpoint R2 (https://<account_id>.r2.cloudflarestorage.com). Mismo que ya usa el app.
      - key: S3_ENDPOINT
        sync: false
      # R2 usa "auto".
      - key: S3_REGION
        value: auto
      - key: RAILS_ENV
        value: production

  # ── PRODUCCIÓN ────────────────────────────────────────────────────────────
  # DESCOMENTAR recién cuando staging esté andando y quieras alinear prod con
  # este archivo. Ojo: `name` tiene que coincidir EXACTO con el servicio que ya
  # existe, o Render crea uno nuevo en paralelo.
  #
  # - type: worker
  #   name: club-cultivo-worker          # ← el que hay que verificar que exista
  #   runtime: ruby
  #   plan: starter
  #   branch: master
  #   rootDir: backend
  #   buildCommand: bundle install
  #   startCommand: bundle exec sidekiq -C config/sidekiq.yml
  #   envVars:
  #     - key: RAILS_ENV
  #       value: production
  #     - key: DATABASE_URL      # la MISMA base que el web service
  #       sync: false
  #     - key: REDIS_URL         # el MISMO Redis que el web service
  #       sync: false
  #     - key: RAILS_MASTER_KEY
  #       sync: false
  #     - key: DEVISE_JWT_SECRET_KEY
  #       sync: false
  #     - key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
  #       sync: false
  #     - key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
  #       sync: false
  #     - key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
  #       sync: false
