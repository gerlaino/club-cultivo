# LOS TESTS CORREN SOLOS EN CADA PUSH (2-oct-2026).
#
# Hasta hoy, que la suite estuviera verde dependía de acordarse de correrla antes de pushear, y
# todo push a `master` iba directo a producción. Con esto GitHub corre backend y frontend en cada
# push; en Render, el auto-deploy de producción se pone en «After CI Checks Pass» y un push con
# tests en rojo NO llega a los usuarios (docs/INFRA.md, paso 7).
#
# Las claves de acá son de MENTIRA, sólo para que la app arranque en modo test. Ningún secreto
# real vive en GitHub.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (RSpec)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379/0
      DEVISE_JWT_SECRET_KEY: ci-no-es-un-secreto-real-0000000000000000000000000000000000000000
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ci-primary-key-no-real-000000000
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ci-deterministic-no-real-0000000
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ci-salt-no-real-000000000000000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Paquetes del sistema
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips postgresql-client
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.9"
          bundler-cache: true
          working-directory: backend
      - name: Base de datos
        run: bin/rails db:create db:schema:load
      - name: RSpec
        run: bundle exec rspec --format progress

  frontend:
    name: Frontend (Vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Vitest
        run: npm run test
      - name: Build
        run: npm run build
